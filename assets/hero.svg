<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" role="img" aria-labelledby="title description">
  <title id="title">DistroHop</title>
  <desc id="description">DistroHop detects local profiles, creates a verified encrypted bundle, and restores it on Linux or Windows.</desc>

  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="1240" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11161D"/>
      <stop offset=".52" stop-color="#171D27"/>
      <stop offset="1" stop-color="#10151B"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7594FF"/>
      <stop offset="1" stop-color="#2962FF"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#65D8AA"/>
      <stop offset="1" stop-color="#16865C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#05070A" flood-opacity=".34"/>
    </filter>
  </defs>

  <!-- Everything stays inside this eight-pixel safe area. -->
  <rect x="8" y="8" width="1264" height="414" rx="28" fill="url(#bg)" stroke="#202833"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="640" y="62" text-anchor="middle" fill="#F4F7FA" font-size="38" font-weight="700" letter-spacing=".3">DistroHop</text>
    <text x="640" y="91" text-anchor="middle" fill="#A2ADB8" font-size="15">Detect  ·  Protect  ·  Verify  ·  Restore</text>

    <!-- Source card -->
    <g filter="url(#shadow)">
      <rect x="70" y="127" width="300" height="202" rx="22" fill="#1B222A" stroke="#343E49"/>
      <rect x="92" y="149" width="256" height="158" rx="15" fill="#11171D" stroke="#29323C"/>
    </g>
    <circle cx="113" cy="174" r="5" fill="#65D8AA"/>
    <text x="127" y="179" fill="#8F9BA7" font-size="12" font-weight="600" letter-spacing=".8">1  ·  DETECT</text>
    <rect x="108" y="205" width="58" height="58" rx="17" fill="#1D315F"/>
    <circle cx="133" cy="230" r="13" fill="none" stroke="#7594FF" stroke-width="5"/>
    <path d="m143 240 11 11" fill="none" stroke="#7594FF" stroke-width="5" stroke-linecap="round"/>
    <text x="184" y="226" fill="#F1F5F8" font-size="19" font-weight="650">Source found</text>
    <text x="184" y="250" fill="#8F9BA7" font-size="13">Linux or Windows</text>
    <text x="108" y="286" fill="#65717D" font-size="12">Browsers  ·  AI tools  ·  Developer data</text>

    <!-- First connector, contained entirely in its gap. -->
    <path d="M390 228h56" fill="none" stroke="#46515E" stroke-width="3" stroke-linecap="round"/>
    <circle cx="402" cy="228" r="4" fill="#7594FF"/>
    <circle cx="423" cy="228" r="4" fill="#7594FF" opacity=".55"/>
    <path d="m436 217 12 11-12 11" fill="none" stroke="#7594FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bundle card -->
    <g filter="url(#shadow)">
      <rect x="460" y="115" width="360" height="226" rx="24" fill="#1C232B" stroke="#536FB9"/>
    </g>
    <text x="488" y="150" fill="#9BA8B5" font-size="12" font-weight="600" letter-spacing=".8">2  ·  PROTECT &amp; VERIFY</text>

    <path d="M490 178a12 12 0 0 1 12-12h67l25 25v101a12 12 0 0 1-12 12h-80a12 12 0 0 1-12-12Z" fill="url(#blue)"/>
    <path d="M569 166v20a7 7 0 0 0 7 7h18" fill="#9CB1FF" opacity=".75"/>
    <path d="M520 236v-12a18 18 0 0 1 36 0v12" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <rect x="513" y="234" width="50" height="39" rx="9" fill="#FFFFFF"/>
    <circle cx="538" cy="250" r="5" fill="#2962FF"/>
    <path d="M538 254v7" stroke="#2962FF" stroke-width="4" stroke-linecap="round"/>

    <text x="620" y="197" fill="#F4F7FA" font-size="21" font-weight="675">Verified bundle</text>
    <text x="620" y="226" fill="#9BA8B5" font-size="13">Encrypted payload</text>
    <text x="620" y="248" fill="#9BA8B5" font-size="13">SHA-256 manifest</text>
    <rect x="620" y="269" width="166" height="38" rx="19" fill="#163A31" stroke="#245B4A"/>
    <circle cx="641" cy="288" r="11" fill="url(#green)"/>
    <path d="m635 288 4 4 8-9" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="660" y="293" fill="#65D8AA" font-size="13" font-weight="650">Copy verified</text>

    <!-- Second connector, contained entirely in its gap. -->
    <path d="M834 228h56" fill="none" stroke="#46515E" stroke-width="3" stroke-linecap="round"/>
    <circle cx="846" cy="228" r="4" fill="#65D8AA"/>
    <circle cx="867" cy="228" r="4" fill="#65D8AA" opacity=".55"/>
    <path d="m880 217 12 11-12 11" fill="none" stroke="#65D8AA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Destination card -->
    <g filter="url(#shadow)">
      <rect x="910" y="127" width="300" height="202" rx="22" fill="#1B222A" stroke="#343E49"/>
      <rect x="932" y="149" width="256" height="158" rx="15" fill="#11171D" stroke="#29323C"/>
    </g>
    <circle cx="953" cy="174" r="5" fill="#65D8AA"/>
    <text x="967" y="179" fill="#8F9BA7" font-size="12" font-weight="600" letter-spacing=".8">3  ·  RESTORE</text>
    <rect x="948" y="205" width="58" height="58" rx="17" fill="#173B32"/>
    <path d="M964 225h19v19" fill="none" stroke="#65D8AA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m982 225-22 23" fill="none" stroke="#65D8AA" stroke-width="5" stroke-linecap="round"/>
    <text x="1024" y="226" fill="#F1F5F8" font-size="19" font-weight="650">Ready to move</text>
    <text x="1024" y="250" fill="#8F9BA7" font-size="13">Linux or Windows</text>
    <text x="948" y="286" fill="#65717D" font-size="12">Atomic  ·  Same-engine  ·  Cross-engine</text>

    <!-- Footer stays centered and away from the outer edge. -->
    <rect x="396" y="369" width="488" height="32" rx="16" fill="#141B22" stroke="#27313B"/>
    <circle cx="424" cy="385" r="4" fill="#7594FF"/>
    <text x="437" y="390" fill="#7F8B97" font-size="12">Dry-run first</text>
    <circle cx="555" cy="385" r="4" fill="#65D8AA"/>
    <text x="568" y="390" fill="#7F8B97" font-size="12">Independent copies</text>
    <circle cx="718" cy="385" r="4" fill="#F0A84A"/>
    <text x="731" y="390" fill="#7F8B97" font-size="12">Safe fallbacks</text>
  </g>
</svg>
