name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test
        run: python -m unittest discover -v
      - name: Compile
        run: python -m compileall -q distrohop
      - name: Package install smoke
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install --no-deps .
          distrohop --cli
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Windows fixtures and crypto
        run: >-
          python -m unittest -v
          tests.test_phase7_aesgcm_windows
          tests.test_phase7_windows
          tests.test_platform
      - name: Real Windows runtime smoke
        run: python -m tools.windows_smoke
      - name: Compile
        run: python -m compileall -q distrohop
      - name: Package install
        run: python -m pip install --no-deps .
      - name: Bootstrapped CLI import smoke
        shell: pwsh
        run: |
          $env:DISTROHOP_BOOTSTRAPPED = "1"
          distrohop --cli
